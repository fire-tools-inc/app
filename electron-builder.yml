appId: dev.mb-consulting.firetools
productName: Fire Tools
copyright: Copyright © 2026 Fire Tools Contributors

# Artifact names MUST NOT contain spaces. `productName` ("Fire Tools") has one,
# and default templates have historically been mangled inconsistently:
#   on-disk file -> "Fire Tools-..." (space)
#   latest*.yml  -> "Fire-Tools-..." (electron-updater sanitizes space to hyphen)
#   GitHub asset -> "Fire.Tools-..." (Releases rewrites space to a dot on upload)
# Use the GitHub-safe dot prefix explicitly so manifests and uploaded assets
# resolve to the same URL.
artifactName: "Fire.Tools-${version}-${arch}.${ext}"

directories:
  output: release/${version}
  buildResources: electron/build

files:
  - &app-files "{electron/**/*,dist-electron/**/*,server/{dist,migrations,public,tessdata}/**/*,package.json}"
  - &dependency-docs "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}"
  - &dependency-tests "!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}"
  - &dependency-types "!**/node_modules/*.d.ts"
  - &dependency-bins "!**/node_modules/.bin"
  - &sqlite-builds "!**/node_modules/{better-sqlite3,better-sqlite3-multiple-ciphers}/build/**/*"
  - &development-artifacts "!{tests,test-results,coverage,playwright-report}/**/*"

asarUnpack:
  - "**/*.{node,dll,dylib,so}"
  - "node_modules/better-sqlite3/**/*"
  - "node_modules/@llamaindex/**/*"
  - "server/dist/documentWorker.mjs"
  - "server/tessdata/**/*"

extraMetadata:
  main: electron/main.cjs

asar: true
npmRebuild: false

# After macOS signing (including ad-hoc), re-sign with the correct bundle
# identifier so NotificationCenter attributes notifications to "Fire Tools"
# instead of the default "Electron". See scripts/electron-after-sign.cjs.
afterSign: scripts/electron-after-sign.cjs

mac:
  files:
    - *app-files
    - *dependency-docs
    - *dependency-tests
    - *dependency-types
    - *dependency-bins
    - *sqlite-builds
    - *development-artifacts
    - "!**/node_modules/{better-sqlite3,better-sqlite3-multiple-ciphers}/prebuilds/!(darwin-${arch}).node"
  artifactName: "Fire.Tools-${version}-${arch}-mac.${ext}"
  category: public.app-category.finance
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: electron/build/entitlements.mac.plist
  entitlementsInherit: electron/build/entitlements.mac.plist
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  # Code-signing & notarization driven via env:
  #   CSC_LINK, CSC_KEY_PASSWORD (signing cert)
  #   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID (notarization)
  notarize: false

win:
  files:
    - *app-files
    - *dependency-docs
    - *dependency-tests
    - *dependency-types
    - *dependency-bins
    - *sqlite-builds
    - *development-artifacts
    - "!**/node_modules/{better-sqlite3,better-sqlite3-multiple-ciphers}/prebuilds/!(win32-${arch}).node"
  legalTrademarks: ""
  target:
    - target: nsis
      arch:
        - x64
  # Sign via WINDOWS_CERTIFICATE_LINK / WINDOWS_CERTIFICATE_PASSWORD env when available.

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # Space-free for the same reason as the top-level artifactName above.
  artifactName: "Fire.Tools-Setup-${version}-${arch}.${ext}"
  shortcutName: Fire Tools
  uninstallDisplayName: Fire Tools ${version}
  createDesktopShortcut: true
  createStartMenuShortcut: true

linux:
  files:
    - *app-files
    - *dependency-docs
    - *dependency-tests
    - *dependency-types
    - *dependency-bins
    - *sqlite-builds
    - *development-artifacts
    - "!**/node_modules/{better-sqlite3,better-sqlite3-multiple-ciphers}/prebuilds/!(linux-${arch}|linuxmusl-${arch}).node"
  category: Finance
  target:
    - target: AppImage
      arch:
        - x64

publish:
  provider: github
  owner: fire-tools-inc
  repo: app
  releaseType: release
