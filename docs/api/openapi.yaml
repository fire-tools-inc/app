  # ---------------------------------------------------------------------------
  # PDF import (experimental)
  # ---------------------------------------------------------------------------
  /document-text:
    post:
      tags: [PdfImport]
      summary: Parse a document with local LiteParse and OCR
      description: |
        Accepts raw PDF, JPEG, PNG or WebP bytes, up to 10 MB and 100 pages.
        Parsing runs in an isolated child process with a 60-second deadline.
        No financial writes, external OCR service or model call occurs.
      operationId: extractDocumentText
      parameters:
        - in: query
          name: fileName
          required: true
          schema: { type: string, minLength: 1, maxLength: 255 }
      requestBody:
        required: true
        content:
          application/pdf:
            schema: { type: string, format: binary }
          image/jpeg:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
          image/webp:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Extracted text and positioned page items
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentTextResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '408': { description: Parsing cancelled or timed out; no financial data changed }
        '413': { description: Document exceeds 10 MB }
        '415': { description: Unsupported document type }
        '422': { description: Parse failure or more than 100 pages }
        '429': { description: Local parser concurrency limit reached }

  /receipts:
    get:
      tags: [PdfImport]
      summary: List stored original receipt images
      operationId: listReceipts
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [pending, reviewed] } }
        - { in: query, name: cursor, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        '200':
          description: Metadata only; no image bytes in the list
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ReceiptDocument' } }
                  nextCursor: { type: string, nullable: true }
    post:
      tags: [PdfImport]
      summary: Store an original receipt photo without creating financial entries
      operationId: saveReceipt
      description: Original bytes are retained in SQLite. Identical SHA-256 content is idempotent within a user.
      parameters:
        - { in: query, name: fileName, required: true, schema: { type: string, minLength: 1, maxLength: 255 } }
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
      responses:
        '201':
          description: Stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReceiptDocument' }
        '200':
          description: Identical original already stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReceiptDocument' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { description: Photo exceeds 10 MB }
        '415': { description: Unsupported image type }
    delete:
      tags: [PdfImport]
      summary: Delete all original receipts for the current user
      description: Stops that user's active pairing; financial entries are unchanged. Used by the explicitly confirmed data reset.
      operationId: clearReceiptOriginals
      responses:
        '204': { description: Original receipts deleted }

  /receipts/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    patch:
      tags: [PdfImport]
      summary: Mark a receipt pending or reviewed without deleting its original
      operationId: reviewReceipt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [pending, reviewed] }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReceiptDocument' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [PdfImport]
      summary: Delete a stored original image without deleting financial entries
      operationId: deleteReceipt
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /receipts/{id}/content:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [PdfImport]
      summary: Download a retained original receipt image
      operationId: getReceiptOriginal
      responses:
        '200':
          description: Original binary bytes with no-store and nosniff headers
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/NotFound' }

  /receipt-pairings:
    post:
      tags: [PdfImport]
      summary: Start a short-lived upload-only phone listener
      description: |
        Explicitly opens a separate listener; the desktop financial API stays
        loopback-only. The receiver serves /receipt-upload and accepts POST
        /receipts with its generated bearer capability, for at most 30 minutes.
        It cannot list or read receipts or access financial/settings endpoints.
        The caller must protect the normal local API and share links only with
        the intended phone. An optional HTTPS origin must already tunnel to
        the receiver port; Fire Tools never provisions a tunnel.
      operationId: startReceiptPairing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                port: { type: integer, minimum: 0, maximum: 65535, default: 8790, description: '0 chooses a random port; explicit ports must be at least 1024.' }
                publicUrl: { type: string, format: uri, description: 'Optional HTTPS tunnel origin or private IPv4 HTTP origin for a published container port. No paths, credentials, query or fragment.' }
                language: { type: string, enum: [en, it, fr, de, es], default: en }
      responses:
        '201':
          description: Upload listener started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReceiptPairing' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: A receipt pairing is already active }

  /receipt-pairings/{pairingId}:
    parameters:
      - { in: path, name: pairingId, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [PdfImport]
      summary: Stop the upload-only listener immediately
      operationId: stopReceiptPairing
      responses:
        '204': { description: Pairing stopped; stored receipts are retained }
        '404': { $ref: '#/components/responses/NotFound' }

  /pdf-imports:
    get:
      tags: [PdfImport]
      summary: List PDF import sessions
      operationId: listPdfImports
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [pending, reviewed, committed, discarded] } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PdfImport' }
    post:
      tags: [PdfImport]
      summary: Persist a parsed PDF (drafts produced client-side)
      operationId: createPdfImport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PdfImportCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PdfImport' }

  /pdf-imports/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [PdfImport]
      summary: Get a PDF import session
      operationId: getPdfImport
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PdfImport' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [PdfImport]
      summary: Update drafts / change status
      operationId: updatePdfImport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [pending, reviewed, committed, discarded]
                drafts:
                  type: array
                  items: { $ref: '#/components/schemas/ParsedTransactionDraft' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PdfImport' }
    delete:
      tags: [PdfImport]
      summary: Delete a PDF import session
      operationId: deletePdfImport
      responses:
        '204': { description: Deleted }

  /pdf-imports/{id}/commit:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [PdfImport]
      summary: Commit selected drafts into the expense tracker
      operationId: commitPdfImport
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  importedExpenses: { type: integer }
                  importedIncomes:  { type: integer }

  # ---------------------------------------------------------------------------
  # Portfolio breakdown
  # ---------------------------------------------------------------------------
  /portfolio-breakdown/metadata/{ticker}:
    parameters:
      - in: path
        name: ticker
        required: true
        schema: { type: string }
    get:
      tags: [PortfolioBreakdown]
      summary: Get cached asset metadata for a ticker
      description: Stored in the database only and not shown in the app.
      operationId: getAssetMetadata
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetMetadata' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [PortfolioBreakdown]
      summary: Upsert cached asset metadata
      description: Stored in the database only and not shown in the app.
      operationId: replaceAssetMetadata
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssetMetadata' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetMetadata' }

  /portfolio-breakdown:
    get:
      tags: [PortfolioBreakdown]
      summary: Compute portfolio breakdown across one or more dimensions
      description: >-
        Computed from the database holdings and cached metadata. The app computes
        its own breakdown; this result is not shown in the app.
      operationId: getPortfolioBreakdown
      parameters:
        - in: query
          name: dimension
          required: true
          schema:
            type: array
            items: { $ref: '#/components/schemas/BreakdownDimension' }
          style: form
          explode: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BreakdownResult' }

  # ---------------------------------------------------------------------------
  # Banks lookup
  # ---------------------------------------------------------------------------
  /banks:
    get:
      tags: [Banks]
      summary: List supported banks / brokers
      operationId: listBanks
      parameters:
        - { in: query, name: countryCode,         schema: { type: string } }
        - { in: query, name: supportsOpenBanking, schema: { type: boolean } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BankInfo' }

  /banks/{code}:
    parameters:
      - in: path
        name: code
        required: true
        schema: { type: string }
    get:
      tags: [Banks]
      summary: Get a single bank/broker by code
      operationId: getBank
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankInfo' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------------------
  # UI Preferences (generic per-user KV)
  # ---------------------------------------------------------------------------
  /ui-preferences:
    get:
      tags: [UiPreferences]
      summary: Get all UI preferences for the current user
      operationId: listUiPreferences
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UiPreferenceMap' }

  /ui-preferences/{key}:
    parameters:
      - in: path
        name: key
        required: true
        schema:
          type: string
          pattern: '^[A-Za-z][A-Za-z0-9_.-]{0,63}$'
    get:
      tags: [UiPreferences]
      summary: Get a single UI preference
      operationId: getUiPreference
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UiPreference' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [UiPreferences]
      summary: Upsert a single UI preference
      operationId: putUiPreference
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UiPreferenceInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UiPreference' }
        '400': { $ref: '#/components/responses/BadRequest' }
    delete:
      tags: [UiPreferences]
      summary: Delete a single UI preference
      operationId: deleteUiPreference
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

# =============================================================================
# Components
# =============================================================================
components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Opaque token. Required only when the server was started with one
        (`API_TOKEN` for standalone servers; the desktop app generates one per
        launch for its embedded backend). Every route except `GET /health`
        then needs `Authorization: Bearer <token>`. Tokens are compared in
        constant time. CORS preflight requests never need it.

  parameters:
    IdPath:
      in: path
      name: id
      required: true
      schema: { type: integer, format: int64 }
    ExternalId:
      in: path
      name: externalId
      required: true
      schema: { type: string }
      description: Client-minted stable id (e.g. "txn-123-abc")
    Year:
      in: path
      name: year
      required: true
      schema: { type: integer, minimum: 1900, maximum: 9999 }
    Month:
      in: path
      name: month
      required: true
      schema: { type: integer, minimum: 1, maximum: 12 }
    SyncDomainPath:
      in: path
      name: domain
      required: true
      schema: { $ref: '#/components/schemas/SyncDomain' }
    Cursor:
      in: query
      name: cursor
      schema: { type: string }
      description: Opaque pagination cursor returned in a prior response
    Limit:
      in: query
      name: limit
      schema: { type: integer, minimum: 1, maximum: 500, default: 100 }

  responses:
    BadRequest:
      description: Request payload failed validation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Resource conflict (e.g. duplicate externalId)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServiceUnavailable:
      description: Required subsystem is unavailable (e.g. settings file disabled for in-memory DB)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: The server requires a bearer token and none or a wrong one was sent (`unauthorized`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PayloadTooLarge:
      description: The JSON body exceeds the route's limit (`payload_too_large`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InvalidChange:
      description: >-
        `invalid_body`: the changeset or one of its items is invalid. Nothing
        was written. `details` names the item.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ChangesetError' }
    ConflictingChange:
      description: >-
        `conflict`: an item collides with saved data, for example a scheduled
        occurrence that is already recorded. Nothing was written.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ChangesetError' }

  schemas:
    # -- Shared --------------------------------------------------------------
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:    { type: string, example: VALIDATION_FAILED }
            message: { type: string }
            details:
              type: object
              additionalProperties: true

    Health:
      type: object
      properties:
        status:    { type: string, enum: [ok] }
        version:   { type: string }
        timestamp: { type: string, format: date-time }

    PaginationCursor:
      type: object
      properties:
        nextCursor:
          type: string
          nullable: true

    SupportedCurrency:
      type: string
      enum: [EUR, USD, GBP, CHF, JPY, AUD, CAD]

    # -- Users / Settings ----------------------------------------------------
    User:
      type: object
      required: [id, email]
      properties:
        id:          { type: integer, format: int64, example: 1 }
        email:       { type: string, format: email }
        displayName: { type: string, nullable: true }
        createdAt:   { type: string, format: date-time }
        updatedAt:   { type: string, format: date-time }

    ExperimentalFeatures:
      type: object
      properties:
        portfolioBreakdown: { type: boolean, default: false }
        pdfImport:          { type: boolean, default: false }

    LlmProvider:
      type: string
      enum: [local, openrouter, openai, gemini, anthropic, custom]
      description: >-
        Preset that filled in the OpenAI-compatible endpoint. Omitted for
        configurations saved before presets existed; clients then treat
        loopback URLs as `local` and other URLs as `custom`. Unknown values
        are rejected with `400 invalid_body`.

    LlmCategorizationConfig:
      type: object
      required: [baseUrl, apiKey, model]
      properties:
        provider: { $ref: '#/components/schemas/LlmProvider' }
        baseUrl: { type: string, description: 'OpenAI-compatible base URL without /chat/completions.' }
        apiKey:  { type: string, format: password, description: 'May be empty for unauthenticated local OpenAI-compatible models.' }
        model:   { type: string }

    CurrencySettings:
      type: object
      required: [defaultCurrency, fallbackRates, useApiRates]
      properties:
        defaultCurrency: { $ref: '#/components/schemas/SupportedCurrency' }
        fallbackRates:
          type: object
          additionalProperties: { type: number }
        useApiRates:   { type: boolean }
        lastApiUpdate: { type: string, format: date-time, nullable: true }

    AssetClassInclusionMap:
      type: object
      properties:
        STOCKS:       { type: boolean }
        BONDS:        { type: boolean }
        CASH:         { type: boolean }
        CRYPTO:       { type: boolean }
        REAL_ESTATE:  { type: boolean }
        COMMODITIES:  { type: boolean }
        VEHICLE:      { type: boolean }
        COLLECTIBLE:  { type: boolean }
        ART:          { type: boolean }

    UserSettings:
      type: object
      required:
        - accountName
        - decimalSeparator
        - decimalPlaces
        - currencySettings
        - privacyMode
        - dateFormat
        - fireAssetClassInclusion
        - includePrimaryResidenceInFIRE
        - searchThreshold
        - experimentalFeatures
      properties:
        accountName:      { type: string }
        decimalSeparator: { type: string, enum: ['.', ','] }
        decimalPlaces:    { type: integer }
        currencySettings: { $ref: '#/components/schemas/CurrencySettings' }
        privacyMode:      { type: boolean }
        country:          { type: string, nullable: true }
        dateFormat:       { type: string, enum: [DD/MM/YYYY, MM/DD/YYYY, YYYY-MM-DD] }
        fireAssetClassInclusion: { $ref: '#/components/schemas/AssetClassInclusionMap' }
        includePrimaryResidenceInFIRE: { type: boolean }
        searchThreshold:        { type: integer }
        experimentalFeatures:   { $ref: '#/components/schemas/ExperimentalFeatures' }
        aiFeaturesEnabled:      { type: boolean, default: true, description: 'Master permission for hosted/local AI model calls. Per-action opt-in is still required; local OCR and document imports are unaffected.' }
        language:               { type: string, enum: [en, it, fr, de, es], description: 'UI language. Omitted until set; send null in a PATCH to clear it.' }
        llmCategorization:      { $ref: '#/components/schemas/LlmCategorizationConfig' }

    UserSettingsPatch:
      description: Same shape as UserSettings, but every field is optional
      type: object
      properties:
        accountName:      { type: string }
        decimalSeparator: { type: string, enum: ['.', ','] }
        decimalPlaces:    { type: integer }
        currencySettings: { $ref: '#/components/schemas/CurrencySettings' }
        privacyMode:      { type: boolean }
        country:          { type: string, nullable: true }
        dateFormat:       { type: string, enum: [DD/MM/YYYY, MM/DD/YYYY, YYYY-MM-DD] }
        fireAssetClassInclusion: { $ref: '#/components/schemas/AssetClassInclusionMap' }
        includePrimaryResidenceInFIRE: { type: boolean }
        searchThreshold:        { type: integer }
        experimentalFeatures:   { $ref: '#/components/schemas/ExperimentalFeatures' }
        aiFeaturesEnabled:      { type: boolean, description: 'Enable or disable all AI model calls without clearing endpoint/model configuration. Does not disable local OCR or imports.' }
        language:               { type: string, enum: [en, it, fr, de, es], nullable: true, description: 'UI language; null clears it.' }
        llmCategorization:      { $ref: '#/components/schemas/LlmCategorizationConfig' }

    # -- Notifications -------------------------------------------------------
    NotificationType:
      type: string
      enum:
        - NEW_MONTH
        - NEW_QUARTER
        - TAX_REMINDER
        - INCOME_LOGGED
        - EXPENSE_LOGGED
        - NET_WORTH_UPDATE
        - DCA_REMINDER
        - FIRE_MILESTONE
        - PORTFOLIO_REBALANCE
        - SYSTEM
        - WELCOME

    NotificationPriority:
      type: string
      enum: [LOW, MEDIUM, HIGH]

    Notification:
      type: object
      required: [id, externalId, type, title, message, timestamp, read, priority]
      properties:
        id:          { type: integer, format: int64 }
        externalId:  { type: string }
        type:        { $ref: '#/components/schemas/NotificationType' }
        title:       { type: string }
        message:     { type: string }
        timestamp:   { type: string, format: date-time }
        read:        { type: boolean }
        priority:    { $ref: '#/components/schemas/NotificationPriority' }
        actionUrl:   { type: string, nullable: true }
        actionLabel: { type: string, nullable: true }
        expiresAt:   { type: string, format: date-time, nullable: true }

    NotificationCreate:
      type: object
      required: [type, title, message]
      properties:
        externalId:  { type: string }
        type:        { $ref: '#/components/schemas/NotificationType' }
        title:       { type: string }
        message:     { type: string }
        priority:    { $ref: '#/components/schemas/NotificationPriority' }
        actionUrl:   { type: string, nullable: true }
        actionLabel: { type: string, nullable: true }
        expiresAt:   { type: string, format: date-time, nullable: true }

    NotificationList:
      allOf:
        - $ref: '#/components/schemas/PaginationCursor'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Notification' }

    NotificationPreferences:
      type: object
      required:
        - enableInAppNotifications
        - newMonthReminders
        - newQuarterReminders
        - taxReminders
        - dcaReminders
        - portfolioAlerts
        - fireMilestones
        - enableEmailNotifications
        - emailAddress
        - emailFrequency
        - taxReminderMonths
        - taxReminderDaysBefore
      properties:
        enableInAppNotifications: { type: boolean }
        newMonthReminders:        { type: boolean }
        newQuarterReminders:      { type: boolean }
        taxReminders:             { type: boolean }
        dcaReminders:             { type: boolean }
        portfolioAlerts:          { type: boolean }
        fireMilestones:           { type: boolean }
        enableEmailNotifications: { type: boolean }
        emailAddress:             { type: string }
        emailFrequency:           { type: string, enum: [DAILY, WEEKLY, MONTHLY, NEVER] }
        taxReminderMonths:
          type: array
          items: { type: integer, minimum: 1, maximum: 12 }
        taxReminderDaysBefore:    { type: integer, minimum: 0 }
        lastChecked: { type: string, format: date-time, nullable: true }

    PerUserSettings:
      type: object
      properties:
        settings:                 { $ref: '#/components/schemas/UserSettingsPatch' }
        notificationPreferences:  { $ref: '#/components/schemas/NotificationPreferences' }

    SettingsFileShape:
      type: object
      required: [schemaVersion, generatedAt, users]
      properties:
        schemaVersion: { type: integer, example: 1 }
        generatedAt:   { type: string, format: date-time }
        users:
          type: object
          description: Per-user settings, keyed by user id (string). Single-user installs use "1".
          additionalProperties: { $ref: '#/components/schemas/PerUserSettings' }

    SettingsFileEnvelope:
      type: object
      required: [path, exists]
      properties:
        path:     { type: string, description: Absolute path to settings.json }
        exists:   { type: boolean }
        contents:
          $ref: '#/components/schemas/SettingsFileShape'

    # -- Calculator ----------------------------------------------------------
    CalculatorInputs:
      type: object
      required:
        - initialSavings
        - stocksPercent
        - bondsPercent
        - cashPercent
        - currentAnnualExpenses
        - fireAnnualExpenses
        - annualLaborIncome
        - laborIncomeGrowthRate
        - savingsRate
        - desiredWithdrawalRate
        - yearsOfExpenses
        - expectedStockReturn
        - expectedBondReturn
        - expectedCashReturn
        - yearOfBirth
        - retirementAge
        - statePensionIncome
        - privatePensionIncome
        - otherIncome
        - stopWorkingAtFIRE
        - maxAge
        - useAssetAllocationValue
        - useExpenseTrackerExpenses
        - useExpenseTrackerIncome
      properties:
        initialSavings:               { type: number }
        stocksPercent:                { type: number }
        bondsPercent:                 { type: number }
        cashPercent:                  { type: number }
        currentAnnualExpenses:        { type: number }
        fireAnnualExpenses:           { type: number }
        annualLaborIncome:            { type: number }
        laborIncomeGrowthRate:        { type: number }
        savingsRate:                  { type: number }
        desiredWithdrawalRate:        { type: number }
        yearsOfExpenses:              { type: number }
        expectedStockReturn:          { type: number }
        expectedBondReturn:           { type: number }
        expectedCashReturn:           { type: number }
        yearOfBirth:                  { type: integer }
        retirementAge:                { type: integer }
        statePensionIncome:           { type: number }
        privatePensionIncome:         { type: number }
        otherIncome:                  { type: number }
        stopWorkingAtFIRE:            { type: boolean }
        maxAge:                       { type: integer }
        useAssetAllocationValue:      { type: boolean }
        useExpenseTrackerExpenses:    { type: boolean }
        useExpenseTrackerIncome:      { type: boolean }
        fireType:
          type: string
          enum: [standard, lean, barista, coast, fat]
          default: standard
          description: FIRE variant. The variant fields are optional on writes; omitted ones keep their saved values.
        leanExpenseMultiplier:        { type: number, default: 0.7, description: 'Lean FIRE: share of fireAnnualExpenses.' }
        fatExpenseMultiplier:         { type: number, default: 2, description: 'Fat FIRE: multiple of fireAnnualExpenses.' }
        baristaAnnualIncome:          { type: number, default: 20000, description: 'Barista FIRE: part-time annual income.' }
        coastTargetAge:               { type: integer, default: 65, description: 'Coast FIRE: age at which the portfolio should reach the target.' }

    MonteCarloFixedParameters:
      type: object
      properties:
        initialSavings:           { type: number }
        stocksPercent:            { type: number }
        bondsPercent:             { type: number }
        cashPercent:              { type: number }
        currentAnnualExpenses:    { type: number }
        fireAnnualExpenses:       { type: number }
        annualLaborIncome:        { type: number }
        savingsRate:              { type: number }
        desiredWithdrawalRate:    { type: number }
        expectedStockReturn:      { type: number }
        expectedBondReturn:       { type: number }
        expectedCashReturn:       { type: number }
        numSimulations:           { type: integer }
        stockVolatility:          { type: number }
        bondVolatility:           { type: number }
        blackSwanProbability:     { type: number }
        blackSwanImpact:          { type: number }
        stopWorkingAtFIRE:        { type: boolean }

    SimulationFailureReason:
      type: string
      enum:
        - portfolio_depleted
        - sequence_of_returns_risk
        - unsustainable_ending
        - fire_too_late
        - withdrawal_rate_breach
        - fire_lost
        - forced_return_to_work
        - healthcare_expense_shock

    SimulationYearData:
      type: object
      properties:
        year:              { type: integer }
        age:               { type: integer }
        stockReturn:       { type: number }
        bondReturn:        { type: number }
        cashReturn:        { type: number }
        simulatedInflation: { type: number }
        portfolioReturn:   { type: number }
        isBlackSwan:       { type: boolean }
        expenses:          { type: number }
        laborIncome:       { type: number }
        totalIncome:       { type: number }
        portfolioValue:    { type: number }
        isFIREAchieved:    { type: boolean }
        withdrawalRate:    { type: number }

    SimulationLogEntry:
      type: object
      required: [simulationId, timestamp, success, yearlyData]
      properties:
        simulationId:   { type: integer }
        timestamp:      { type: string, format: date-time }
        success:        { type: boolean }
        yearsToFIRE:    { type: integer, nullable: true }
        finalPortfolio: { type: number }
        yearlyData:
          type: array
          items: { $ref: '#/components/schemas/SimulationYearData' }
        failureReasons:
          type: array
          items: { $ref: '#/components/schemas/SimulationFailureReason' }

    MonteCarloRunCreate:
      type: object
      required:
        - numSimulations
        - stockVolatility
        - bondVolatility
        - blackSwanProbability
        - blackSwanImpact
        - successCount
        - failureCount
        - successRate
        - fixedParameters
      properties:
        numSimulations:        { type: integer }
        stockVolatility:       { type: number }
        bondVolatility:        { type: number }
        blackSwanProbability:  { type: number }
        blackSwanImpact:       { type: number }
        successCount:          { type: integer }
        failureCount:          { type: integer }
        successRate:           { type: number }
        medianYearsToFIRE:     { type: number, nullable: true }
        fixedParameters:       { $ref: '#/components/schemas/MonteCarloFixedParameters' }
        logs:
          type: array
          items: { $ref: '#/components/schemas/SimulationLogEntry' }

    MonteCarloRun:
      allOf:
        - $ref: '#/components/schemas/MonteCarloRunCreate'
        - type: object
          required: [id, runAt]
          properties:
            id:    { type: integer, format: int64 }
            runAt: { type: string, format: date-time }

    MonteCarloRunWithLogs:
      allOf:
        - $ref: '#/components/schemas/MonteCarloRun'

    MonteCarloRunList:
      allOf:
        - $ref: '#/components/schemas/PaginationCursor'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/MonteCarloRun' }

    # -- Asset allocation ----------------------------------------------------
    AssetClass:
      type: string
      enum: [STOCKS, BONDS, CASH, CRYPTO, REAL_ESTATE, COMMODITIES, VEHICLE, COLLECTIBLE, ART]

    SubAssetType:
      type: string
      enum:
        - ETF
        - SINGLE_STOCK
        - SINGLE_BOND
        - SAVINGS_ACCOUNT
        - CHECKING_ACCOUNT
        - BROKERAGE_ACCOUNT
        - MONEY_ETF
        - COIN
        - PROPERTY
        - REIT
        - PRIVATE_EQUITY
        - PHYSICAL_GOLD
        - GOLD_ETC
        - SILVER_ETC
        - OIL_ETC
        - NATURAL_GAS_ETC
        - COPPER_ETC
        - PLATINUM_ETC
        - PALLADIUM_ETC
        - AGRICULTURAL_ETC
        - COMMODITY_ETF
        - CAR
        - MOTORCYCLE
        - BOAT
        - OTHER_VEHICLE
        - WATCH
        - WINE
        - JEWELRY
        - SPORTS_MEMORABILIA
        - OTHER_COLLECTIBLE
        - PAINTING
        - SCULPTURE
        - DIGITAL_ART
        - OTHER_ART
        - NONE

    AllocationMode:
      type: string
      enum: [PERCENTAGE, OFF, SET]

    MortgageData:
      type: object
      required:
        - principalAmount
        - currentBalance
        - interestRate
        - termYears
        - remainingYears
        - monthlyPayment
        - startDate
        - propertyValue
      properties:
        principalAmount: { type: number }
        currentBalance:  { type: number }
        interestRate:    { type: number }
        termYears:       { type: integer }
        remainingYears:  { type: integer }
        monthlyPayment:  { type: number }
        startDate:       { type: string, format: date }
        propertyValue:   { type: number }
        lender:          { type: string }

    Asset:
      type: object
      required:
        - externalId
        - name
        - ticker
        - assetClass
        - subAssetType
        - currentValue
        - targetMode
      properties:
        id:               { type: integer, format: int64, readOnly: true }
        externalId:       { type: string }
        name:             { type: string }
        ticker:           { type: string }
        isin:             { type: string, nullable: true }
        assetClass:       { $ref: '#/components/schemas/AssetClass' }
        subAssetType:     { $ref: '#/components/schemas/SubAssetType' }
        currentValue:     { type: number }
        shares:           { type: number, nullable: true }
        pricePerShare:    { type: number, nullable: true }
        acquisitionPrice: { type: number, nullable: true }
        originalCurrency: { $ref: '#/components/schemas/SupportedCurrency' }
        originalValue:    { type: number, nullable: true }
        targetMode:       { $ref: '#/components/schemas/AllocationMode' }
        targetValue:      { type: number, nullable: true }
        targetPercent:    { type: number, nullable: true }
        institutionCode:  { type: string, nullable: true }
        institutionName:  { type: string, nullable: true }
        mortgageData:     { $ref: '#/components/schemas/MortgageData' }
        isPrimaryResidence: { type: boolean }
        marketPrice:      { type: number, nullable: true }

    AssetClassTargets:
      type: object
      description: Target per asset class, keyed by AssetClass. Any subset of classes may be present.
      additionalProperties:
        type: object
        required: [targetMode]
        properties:
          targetMode:    { $ref: '#/components/schemas/AllocationMode' }
          targetPercent: { type: number }
      example:
        STOCKS: { targetMode: PERCENTAGE, targetPercent: 80 }
        BONDS: { targetMode: PERCENTAGE, targetPercent: 20 }
        CASH: { targetMode: SET }

    AssetAllocationConfig:
      type: object
      required: [currency, allowNegativeCash, targetAllocationTolerance]
      properties:
        currency:                   { type: string, description: 'ISO 4217 (typically EUR)' }
        allowNegativeCash:          { type: boolean }
        targetAllocationTolerance:  { type: number }

    # -- Expense tracker -----------------------------------------------------
    ExpenseType:
      type: string
      enum: [NEED, WANT]

    IncomeSource:
      type: string
      enum: [SALARY, FREELANCE, BUSINESS, INVESTMENTS, RENTAL, PENSION, SOCIAL_SECURITY, BONUS, GIFT, OTHER]

    ExpenseEntry:
      type: object
      required: [externalId, type, date, amount, description, category, expenseType]
      properties:
        id:           { type: integer, format: int64, readOnly: true }
        externalId:   { type: string }
        type:         { type: string, enum: [expense] }
        date:         { type: string, format: date }
        amount:       { type: number }
        description:  { type: string }
        currency:     { $ref: '#/components/schemas/SupportedCurrency' }
        category:
          type: string
          description: >-
            Built-in ExpenseCategory id or custom category id. The retired ids
            `FEES` and `HOLIDAYS` are accepted from older clients and stored as
            `BUSINESS` and `TRAVEL`.
        subCategory:  { type: string, nullable: true }
        expenseType:  { $ref: '#/components/schemas/ExpenseType' }
        isRecurring:  { type: boolean }
        scheduleId:   { type: string, description: 'Optional schedule ID; paired with scheduledDate' }
        scheduledDate: { type: string, format: date, description: 'Original occurrence due date, not actual payment date' }
        unitAmount:   { type: number, minimum: 0, exclusiveMinimum: true, description: 'Price paid each time; paired with quantity, and amount must equal unitAmount × quantity rounded to cents' }
        quantity:     { type: number, minimum: 0, exclusiveMinimum: true, description: 'Times unitAmount was paid in the month; paired with unitAmount' }

    IncomeEntry:
      type: object
      required: [externalId, type, date, amount, description, source]
      properties:
        id:          { type: integer, format: int64, readOnly: true }
        externalId:  { type: string }
        type:        { type: string, enum: [income] }
        date:        { type: string, format: date }
        amount:      { type: number }
        description: { type: string }
        currency:    { $ref: '#/components/schemas/SupportedCurrency' }
        source:      { $ref: '#/components/schemas/IncomeSource' }
        isRecurring: { type: boolean }
        scheduleId:  { type: string, description: 'Optional schedule ID; paired with scheduledDate' }
        scheduledDate: { type: string, format: date, description: 'Original occurrence due date, not actual payment date' }

    PlanningDate:
      type: string
      format: date
      description: Valid calendar date from 1900-01-01 through 2100-12-31.

    CashflowRecurrence:
      type: object
      additionalProperties: false
      required: [unit, interval]
      properties:
        unit: { type: string, enum: [once, day, week, month, year] }
        interval: { type: integer, minimum: 1 }

    CashflowSchedule:
      type: object
      additionalProperties: false
      required: [id, name, kind, amount, currency, startDate, recurrence, enabled, archived]
      properties:
        id: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        kind: { type: string, enum: [expense, income] }
        amount: { type: number, minimum: 0 }
        currency: { $ref: '#/components/schemas/SupportedCurrency' }
        startDate: { $ref: '#/components/schemas/PlanningDate' }
        endDate: { $ref: '#/components/schemas/PlanningDate' }
        recurrence: { $ref: '#/components/schemas/CashflowRecurrence' }
        enabled: { type: boolean }
        archived: { type: boolean }
        category: { type: string, minLength: 1 }
        expenseType: { $ref: '#/components/schemas/ExpenseType' }
        source: { $ref: '#/components/schemas/IncomeSource' }
      oneOf:
        - properties: { kind: { enum: [expense] } }
          required: [category, expenseType]
          not: { properties: { source: {} }, required: [source] }
        - properties: { kind: { enum: [income] } }
          required: [source]
          not:
            anyOf:
              - { properties: { category: {} }, required: [category] }
              - { properties: { expenseType: {} }, required: [expenseType] }

    ScheduledOccurrenceReference:
      type: object
      additionalProperties: false
      required: [scheduleId, scheduledDate]
      properties:
        scheduleId: { type: string, minLength: 1 }
        scheduledDate: { $ref: '#/components/schemas/PlanningDate' }

    SavingsGoal:
      type: object
      additionalProperties: false
      required: [id, name, currency, targetAmount, savedAmount, archived]
      properties:
        id: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        currency: { $ref: '#/components/schemas/SupportedCurrency' }
        targetAmount: { type: number, minimum: 0, exclusiveMinimum: true }
        savedAmount: { type: number, minimum: 0, description: 'Manually earmarked balance; not a new asset or expense' }
        targetDate: { $ref: '#/components/schemas/PlanningDate' }
        archived: { type: boolean }

    ImportRuleMatch:
      type: object
      additionalProperties: false
      required: [description, operator]
      properties:
        description: { type: string, minLength: 1 }
        operator: { type: string, enum: [equals, contains] }
        currency: { $ref: '#/components/schemas/SupportedCurrency' }
        minAmount: { type: number, minimum: 0 }
        maxAmount: { type: number, minimum: 0 }
      description: Literal case-insensitive matching. Amount bounds require currency; maximum must not be less than minimum.

    ImportCategorizationRule:
      type: object
      additionalProperties: false
      required: [id, name, kind, enabled, priority, match]
      properties:
        id: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        kind: { type: string, enum: [expense, income] }
        enabled: { type: boolean }
        priority: { type: integer, minimum: 0, description: 'Lower priority number runs first; first enabled match wins' }
        match: { $ref: '#/components/schemas/ImportRuleMatch' }
        category: { type: string, minLength: 1 }
        expenseType: { $ref: '#/components/schemas/ExpenseType' }
        source: { $ref: '#/components/schemas/IncomeSource' }
      oneOf:
        - properties: { kind: { enum: [expense] } }
          required: [category, expenseType]
          not: { properties: { source: {} }, required: [source] }
        - properties: { kind: { enum: [income] } }
          required: [source]
          not:
            anyOf:
              - { properties: { category: {} }, required: [category] }
              - { properties: { expenseType: {} }, required: [expenseType] }

    CashflowForecastInputs:
      type: object
      additionalProperties: false
      required: [openingBalance, startDate, horizon, currency]
      properties:
        openingBalance: { type: number, description: 'Cash at the start of startDate; may be negative' }
        startDate: { $ref: '#/components/schemas/PlanningDate' }
        horizon: { type: integer, enum: [30, 90, 365] }
        currency: { $ref: '#/components/schemas/SupportedCurrency' }

    ExpensePlanningData:
      type: object
      additionalProperties: false
      required: [schemaVersion, schedules, skippedOccurrences, goals, rules]
      properties:
        schemaVersion: { type: integer, enum: [1] }
        schedules:
          type: array
          items: { $ref: '#/components/schemas/CashflowSchedule' }
        skippedOccurrences:
          type: array
          items: { $ref: '#/components/schemas/ScheduledOccurrenceReference' }
        goals:
          type: array
          items: { $ref: '#/components/schemas/SavingsGoal' }
        rules:
          type: array
          items: { $ref: '#/components/schemas/ImportCategorizationRule' }
        forecast: { $ref: '#/components/schemas/CashflowForecastInputs' }
      description: Versioned planning metadata. IDs within each collection and skipped occurrence references must be unique.

    CategoryBudget:
      type: object
      required: [category, monthlyBudget]
      properties:
        category:
          type: string
          description: >-
            Built-in or custom category id. Budgets for the retired `FEES` and
            `HOLIDAYS` ids are added to the `BUSINESS` and `TRAVEL` budget of the
            same month (or the global list) when the currencies match.
        monthlyBudget: { type: number }
        currency:      { $ref: '#/components/schemas/SupportedCurrency' }
        monthKey:
          type: string
          description: '`YYYY-MM` for per-month budgets; omitted for global budgets'

    CustomCategory:
      type: object
      required: [externalId, name, icon, color, defaultExpenseType]
      properties:
        externalId:         { type: string }
        name:               { type: string }
        icon:               { type: string }
        color:              { type: string }
        defaultExpenseType: { $ref: '#/components/schemas/ExpenseType' }

    CategoryOverride:
      type: object
      required: [categoryId]
      properties:
        categoryId: { type: string, description: 'Built-in ExpenseCategory id. Overrides for the retired FEES and HOLIDAYS ids are ignored.' }
        name:       { type: string, nullable: true }
        icon:       { type: string, nullable: true }
        color:      { type: string, nullable: true }

    MonthData:
      type: object
      required: [year, month, incomes, expenses, budgets]
      properties:
        year:     { type: integer }
        month:    { type: integer, minimum: 1, maximum: 12 }
        isClosed: { type: boolean }
        incomes:
          type: array
          items: { $ref: '#/components/schemas/IncomeEntry' }
        expenses:
          type: array
          items: { $ref: '#/components/schemas/ExpenseEntry' }
        budgets:
          type: array
          items: { $ref: '#/components/schemas/CategoryBudget' }

    ExpenseTrackerConfig:
      type: object
      required: [currency, currentYear, currentMonth]
      properties:
        currency:     { $ref: '#/components/schemas/SupportedCurrency' }
        currentYear:  { type: integer }
        currentMonth: { type: integer, minimum: 1, maximum: 12 }

    ExpenseEntryList:
      allOf:
        - $ref: '#/components/schemas/PaginationCursor'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/ExpenseEntry' }

    IncomeEntryList:
      allOf:
        - $ref: '#/components/schemas/PaginationCursor'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/IncomeEntry' }

    # -- Net worth tracker ---------------------------------------------------
    DepreciationMethod:
      type: string
      enum: [STRAIGHT_LINE, DECLINING_BALANCE, MANUAL]

    VehicleDepreciation:
      type: object
      required: [method, purchasePrice, purchaseDate, salvageValue, usefulLifeYears]
      properties:
        method:                 { $ref: '#/components/schemas/DepreciationMethod' }
        purchasePrice:          { type: number }
        purchaseDate:           { type: string, format: date }
        salvageValue:           { type: number }
        usefulLifeYears:        { type: integer }
        currentDepreciation:    { type: number, nullable: true }
        annualDepreciationRate: { type: number, nullable: true }

    MortgageInfo:
      type: object
      required: [principalAmount, currentBalance, interestRate, termYears, remainingYears, monthlyPayment, startDate]
      properties:
        principalAmount: { type: number }
        currentBalance:  { type: number }
        interestRate:    { type: number }
        termYears:       { type: integer }
        remainingYears:  { type: integer }
        monthlyPayment:  { type: number }
        startDate:       { type: string, format: date }
        lender:          { type: string, nullable: true }

    AssetHolding:
      type: object
      required: [externalId, ticker, name, shares, pricePerShare, currency, assetClass]
      properties:
        id:                  { type: integer, format: int64, readOnly: true }
        externalId:          { type: string }
        ticker:              { type: string }
        name:                { type: string }
        shares:              { type: number }
        pricePerShare:       { type: number }
        acquisitionPrice:    { type: number, nullable: true }
        currency:            { $ref: '#/components/schemas/SupportedCurrency' }
        assetClass:
          type: string
          enum: [STOCKS, BONDS, ETF, CRYPTO, REAL_ESTATE, PRIVATE_EQUITY, VEHICLE, COLLECTIBLE, ART, COMMODITIES, OTHER]
        note:                { type: string, nullable: true }
        isin:                { type: string, nullable: true }
        isPrimaryResidence:  { type: boolean }
        targetMode:          { $ref: '#/components/schemas/AllocationMode' }
        targetPercent:       { type: number, nullable: true }
        targetValue:         { type: number, nullable: true }
        syncAssetClass:      { $ref: '#/components/schemas/AssetClass' }
        syncSubAssetType:    { type: string, nullable: true }
        vehicleDepreciation: { $ref: '#/components/schemas/VehicleDepreciation' }
        mortgageInfo:        { $ref: '#/components/schemas/MortgageInfo' }

    CashEntry:
      type: object
      required: [externalId, accountName, accountType, balance, currency]
      properties:
        id:               { type: integer, format: int64, readOnly: true }
        externalId:       { type: string }
        accountName:      { type: string }
        accountType:
          type: string
          enum: [SAVINGS, CHECKING, BROKERAGE, CREDIT_CARD, OTHER]
        balance:          { type: number }
        currency:         { $ref: '#/components/schemas/SupportedCurrency' }
        note:             { type: string, nullable: true }
        institutionCode:  { type: string, nullable: true }
        institutionName:  { type: string, nullable: true }
        shares:           { type: number, nullable: true }
        pricePerShare:    { type: number, nullable: true }
        targetMode:       { $ref: '#/components/schemas/AllocationMode' }
        targetPercent:    { type: number, nullable: true }
        targetValue:      { type: number, nullable: true }
        syncSubAssetType: { type: string, nullable: true }

    PensionEntry:
      type: object
      required: [externalId, name, currentValue, currency, pensionType]
      properties:
        id:           { type: integer, format: int64, readOnly: true }
        externalId:   { type: string }
        name:         { type: string }
        currentValue: { type: number }
        currency:     { $ref: '#/components/schemas/SupportedCurrency' }
        pensionType:
          type: string
          enum: [STATE, PRIVATE, EMPLOYER, OTHER]
        note:         { type: string, nullable: true }

    DebtEntry:
      type: object
      required: [externalId, name, debtType, currentBalance, currency]
      properties:
        id:              { type: integer, format: int64, readOnly: true }
        externalId:      { type: string }
        name:            { type: string }
        debtType:
          type: string
          enum: [CREDIT_CARD, PERSONAL_LOAN, STUDENT_LOAN, CAR_LOAN, MORTGAGE, OTHER]
        currentBalance:  { type: number }
        interestRate:    { type: number, nullable: true }
        monthlyPayment:  { type: number, nullable: true }
        currency:        { $ref: '#/components/schemas/SupportedCurrency' }
        note:            { type: string, nullable: true }
        creditor:        { type: string, nullable: true }

    TaxEntry:
      type: object
      required: [externalId, name, taxType, amount, currency, isPaid]
      properties:
        id:         { type: integer, format: int64, readOnly: true }
        externalId: { type: string }
        name:       { type: string }
        taxType:
          type: string
          enum: [INCOME_TAX, PROPERTY_TAX, CAPITAL_GAINS_TAX, OTHER]
        amount:     { type: number }
        dueDate:    { type: string, format: date, nullable: true }
        currency:   { $ref: '#/components/schemas/SupportedCurrency' }
        note:       { type: string, nullable: true }
        isPaid:     { type: boolean }

    OperationType:
      type: string
      enum:
        - PURCHASE
        - SALE
        - DIVIDEND
        - EXPENSE_REIMBURSEMENT
        - GIFT_RECEIVED
        - GIFT_GIVEN
        - TAX_PAID
        - CASH_TRANSFER
        - PENSION_CONTRIBUTION
        - PENSION_ADJUSTMENT
        - PRICE_UPDATE
        - OTHER

    FinancialOperation:
      type: object
      required: [externalId, date, type, description, amount, currency]
      properties:
        id:                { type: integer, format: int64, readOnly: true }
        externalId:        { type: string }
        date:              { type: string, format: date }
        type:              { $ref: '#/components/schemas/OperationType' }
        description:       { type: string }
        amount:            { type: number }
        currency:          { $ref: '#/components/schemas/SupportedCurrency' }
        relatedAssetId:    { type: string, nullable: true, description: 'externalId of related asset' }
        relatedAccountId:  { type: string, nullable: true, description: 'externalId of related cash account' }
        note:              { type: string, nullable: true }

    FinancialOperationList:
      allOf:
        - $ref: '#/components/schemas/PaginationCursor'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/FinancialOperation' }

    MonthlySnapshot:
      type: object
      required: [year, month, assets, cashEntries, pensions, operations, debts, taxes, isFrozen]
      properties:
        year:        { type: integer }
        month:       { type: integer, minimum: 1, maximum: 12 }
        assets:
          type: array
          items: { $ref: '#/components/schemas/AssetHolding' }
        cashEntries:
          type: array
          items: { $ref: '#/components/schemas/CashEntry' }
        pensions:
          type: array
          items: { $ref: '#/components/schemas/PensionEntry' }
        operations:
          type: array
          items: { $ref: '#/components/schemas/FinancialOperation' }
        debts:
          type: array
          items: { $ref: '#/components/schemas/DebtEntry' }
        taxes:
          type: array
          items: { $ref: '#/components/schemas/TaxEntry' }
        totalAssetValue:    { type: number, readOnly: true }
        totalCash:          { type: number, readOnly: true }
        totalPension:       { type: number, readOnly: true }
        totalTaxesPaid:     { type: number, readOnly: true }
        totalDebt:          { type: number, readOnly: true }
        totalTaxLiability:  { type: number, readOnly: true }
        netWorth:           { type: number, readOnly: true }
        isFrozen:           { type: boolean }
        frozenDate:         { type: string, format: date-time, nullable: true }
        monthNote:          { type: string, nullable: true }

    NetWorthYearData:
      type: object
      required: [year, months]
      properties:
        year:       { type: integer }
        months:
          type: array
          items: { $ref: '#/components/schemas/MonthlySnapshot' }
        isArchived: { type: boolean }

    NetWorthConfig:
      type: object
      required: [defaultCurrency, currentYear, currentMonth, showPensionInNetWorth, includeUnrealizedGains]
      properties:
        defaultCurrency:           { $ref: '#/components/schemas/SupportedCurrency' }
        currentYear:               { type: integer }
        currentMonth:              { type: integer, minimum: 1, maximum: 12 }
        showPensionInNetWorth:     { type: boolean }
        includeUnrealizedGains:    { type: boolean }
        syncWithAssetAllocation:   { type: boolean }

    NetWorthTrackerData:
      type: object
      required: [years, currentYear, currentMonth, defaultCurrency, settings]
      properties:
        years:
          type: array
          items: { $ref: '#/components/schemas/NetWorthYearData' }
        currentYear:     { type: integer }
        currentMonth:    { type: integer, minimum: 1, maximum: 12 }
        defaultCurrency: { $ref: '#/components/schemas/SupportedCurrency' }
        settings:
          type: object
          required: [showPensionInNetWorth, includeUnrealizedGains]
          properties:
            showPensionInNetWorth:   { type: boolean }
            includeUnrealizedGains:  { type: boolean }
            syncWithAssetAllocation: { type: boolean }

    # -- Questionnaire -------------------------------------------------------
    FIREPersona:
      type: string
      enum: [LEAN_FIRE, REGULAR_FIRE, FAT_FIRE, COAST_FIRE, BARISTA_FIRE]

    AssetAllocationTarget:
      type: object
      required: [stocks, bonds, cash]
      properties:
        stocks:     { type: number }
        bonds:      { type: number }
        cash:       { type: number }
        crypto:     { type: number }
        realEstate: { type: number }

    QuestionnaireResponse:
      type: object
      required: [questionId, selectedOptionId]
      properties:
        questionId:       { type: string }
        selectedOptionId: { type: string }

    QuestionnaireResults:
      type: object
      required:
        - persona
        - personaExplanation
        - safeWithdrawalRate
        - suggestedSavingsRate
        - assetAllocation
        - suitableAssets
        - riskTolerance
        - responses
        - completedAt
      properties:
        id:                   { type: integer, format: int64, readOnly: true }
        persona:              { $ref: '#/components/schemas/FIREPersona' }
        personaExplanation:   { type: string }
        safeWithdrawalRate:   { type: number }
        suggestedSavingsRate: { type: number }
        assetAllocation:      { $ref: '#/components/schemas/AssetAllocationTarget' }
        suitableAssets:
          type: array
          items: { type: string }
        riskTolerance:
          type: string
          enum: [conservative, moderate, aggressive]
        responses:
          type: array
          items: { $ref: '#/components/schemas/QuestionnaireResponse' }
        completedAt: { type: string, format: date-time }

    # -- PDF import ----------------------------------------------------------
    ReceiptDocument:
      type: object
      required: [id, fileName, mimeType, byteLength, sha256, status, createdAt]
      properties:
        id: { type: integer, minimum: 1 }
        fileName: { type: string, minLength: 1, maxLength: 255 }
        mimeType: { type: string, enum: [image/jpeg, image/png, image/webp] }
        byteLength: { type: integer, minimum: 1, maximum: 10485760 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        status: { type: string, enum: [pending, reviewed] }
        createdAt: { type: string, format: date-time }

    ReceiptPairing:
      type: object
      required: [id, port, expiresAt, urls]
      properties:
        id: { type: string, format: uuid }
        port: { type: integer, minimum: 1024, maximum: 65535 }
        expiresAt: { type: string, format: date-time }
        urls:
          type: array
          items: { type: string, format: uri }
          description: 'Private Wi-Fi and optional HTTPS tunnel links. The 30-minute upload-only capability is in each URL fragment; do not log or share links beyond the intended phone.'

    DocumentTextResult:
      type: object
      required: [text, pages, totalPages]
      properties:
        text: { type: string }
        totalPages: { type: integer, minimum: 1, maximum: 100 }
        pages:
          type: array
          items:
            type: object
            required: [pageNum, textItems]
            properties:
              pageNum: { type: integer, minimum: 1 }
              textItems:
                type: array
                items:
                  type: object
                  required: [text, x, y]
                  properties:
                    text: { type: string }
                    x: { type: number }
                    y: { type: number }

    PdfDocType:
      type: string
      enum: [auto, receipt, invoice, bank_statement, payslip]

    ParsedKind:
      type: string
      enum: [income, expense]

    ParsedTransactionDraft:
      type: object
      required: [id, kind, date, amount, description, docType, sourceFile, include, confidence]
      properties:
        id:                      { type: string }
        kind:                    { $ref: '#/components/schemas/ParsedKind' }
        date:                    { type: string }
        amount:                  { type: number }
        currency:                { $ref: '#/components/schemas/SupportedCurrency' }
        description:             { type: string }
        suggestedCategory:       { type: string, nullable: true }
        suggestedExpenseType:    { $ref: '#/components/schemas/ExpenseType' }
        suggestedIncomeSource:   { $ref: '#/components/schemas/IncomeSource' }
        docType:
          type: string
          enum: [receipt, invoice, bank_statement, payslip]
        sourceFile:    { type: string }
        rawLine:       { type: string, nullable: true }
        include:       { type: boolean }
        confidence:    { type: number, minimum: 0, maximum: 1 }
        llmEnriched:   { type: boolean }

    PdfImportCreate:
      type: object
      required: [sourceFile, docType, drafts]
      properties:
        sourceFile: { type: string }
        docType:    { $ref: '#/components/schemas/PdfDocType' }
        drafts:
          type: array
          items: { $ref: '#/components/schemas/ParsedTransactionDraft' }

    PdfImport:
      allOf:
        - $ref: '#/components/schemas/PdfImportCreate'
        - type: object
          required: [id, status, createdAt]
          properties:
            id:          { type: integer, format: int64 }
            status:
              type: string
              enum: [pending, reviewed, committed, discarded]
            createdAt:   { type: string, format: date-time }
            committedAt: { type: string, format: date-time, nullable: true }

    # -- Portfolio breakdown -------------------------------------------------
    BreakdownDimension:
      type: string
      enum: [currency, holding, sector, continent, region, market, etfProvider]

    SectorWeight:
      type: object
      required: [sector, weight]
      properties:
        sector: { type: string }
        weight: { type: number }

    RegionWeight:
      type: object
      required: [region, weight]
      properties:
        region: { type: string }
        weight: { type: number }

    AssetMetadata:
      type: object
      required: [ticker, fetchedAt]
      properties:
        ticker:        { type: string }
        quoteType:     { type: string, nullable: true }
        longName:      { type: string, nullable: true }
        shortName:     { type: string, nullable: true }
        currency:      { type: string, nullable: true }
        exchange:      { type: string, nullable: true }
        sector:        { type: string, nullable: true }
        industry:      { type: string, nullable: true }
        country:       { type: string, nullable: true }
        fundFamily:    { type: string, nullable: true }
        category:      { type: string, nullable: true }
        sectorWeightings:
          type: array
          items: { $ref: '#/components/schemas/SectorWeight' }
        regionWeightings:
          type: array
          items: { $ref: '#/components/schemas/RegionWeight' }
        fetchedAt: { type: string, format: date-time }
        error:     { type: string, nullable: true }

    BreakdownEntry:
      type: object
      required: [label, value, percentage]
      properties:
        label:      { type: string }
        value:      { type: number }
        percentage: { type: number }
        color:      { type: string, nullable: true }
        ticker:     { type: string, nullable: true }

    BreakdownResult:
      type: object
      required: [dimension, entries, totalValue, unknownValue]
      properties:
        dimension:    { $ref: '#/components/schemas/BreakdownDimension' }
        entries:
          type: array
          items: { $ref: '#/components/schemas/BreakdownEntry' }
        totalValue:   { type: number }
        unknownValue: { type: number }

    # -- Banks ---------------------------------------------------------------
    InstitutionType:
      type: string
      enum: [BANK, BROKER, NEOBANK, CREDIT_UNION, BUILDING_SOCIETY]

    BankInfo:
      type: object
      required: [code, name, countryCode, supportsOpenBanking]
      properties:
        code:                { type: string }
        name:                { type: string }
        countryCode:         { type: string, description: 'ISO 3166-1 alpha-2' }
        supportsOpenBanking: { type: boolean }
        bic:                 { type: string, nullable: true }
        institutionType:     { $ref: '#/components/schemas/InstitutionType' }
        logoUrl:             { type: string, nullable: true }

    # -- UI Preferences ------------------------------------------------------
    UiPreference:
      type: object
      required: [key, value, updatedAt]
      properties:
        key:       { type: string, pattern: '^[A-Za-z][A-Za-z0-9_.-]{0,63}$' }
        value:     { type: string, maxLength: 8192, description: 'Opaque string (typically JSON-encoded)' }
        updatedAt: { type: string, format: date-time }

    UiPreferenceInput:
      type: object
      required: [value]
      properties:
        value: { type: string, maxLength: 8192 }

    UiPreferenceMap:
      type: object
      required: [preferences]
      properties:
        preferences:
          type: object
          additionalProperties: { type: string }
          description: 'Map of preference key → opaque string value'

    # -- Audit log -----------------------------------------------------------
    AuditActionType:
      type: string
      description: 'Discrete, user-meaningful action recorded in the audit log.'
      enum:
        - CREATE_ASSET
        - UPDATE_ASSET
        - DELETE_ASSET
        - RUN_CALCULATION
        - UPDATE_SETTINGS
        - IMPORT_DATA
        - EXPORT_DATA
        - CLEAR_DATA

    AuditLogEntry:
      type: object
      description: >-
        A single audit log entry. Privacy-first: payloads carry only
        non-sensitive context (ids, counts, field names) and are never
        transmitted off device in the pure-web build.
      required: [id, timestamp, actionType, payload]
      properties:
        id:         { type: string, description: 'Client-minted unique id (UUID when available)' }
        timestamp:  { type: string, format: date-time, description: 'ISO-8601 UTC time of the action' }
        userId:     { type: integer, format: int64, nullable: true, description: 'Owning user (reserved for multi-tenant backend)' }
        sessionId:  { type: string, nullable: true, description: 'Per-app-load session id grouping related actions' }
        actionType: { $ref: '#/components/schemas/AuditActionType' }
        payload:
          type: object
          additionalProperties:
            oneOf:
              - { type: string }
              - { type: number }
              - { type: boolean }
          description: 'Non-sensitive primitive key/value context for the action'

    # -- Sync: whole-domain documents ----------------------------------------
    SyncDomain:
      type: string
      enum: [settings, calculator, assetAllocation, expenseTracker, netWorth]

    SyncDomainStatus:
      type: object
      required: [revision, initialized]
      properties:
        revision:    { type: integer, description: 'Changes on every write; compare for equality only.' }
        initialized: { type: boolean, description: 'True once a client marked the database as the source of truth for the domain.' }

    SyncStatus:
      type: object
      required: [instanceId, domains]
      properties:
        instanceId: { type: string, description: 'Random id of this database; changes when the database is replaced.' }
        domains:
          type: object
          required: [settings, calculator, assetAllocation, expenseTracker, netWorth]
          properties:
            settings:        { $ref: '#/components/schemas/SyncDomainStatus' }
            calculator:      { $ref: '#/components/schemas/SyncDomainStatus' }
            assetAllocation: { $ref: '#/components/schemas/SyncDomainStatus' }
            expenseTracker:  { $ref: '#/components/schemas/SyncDomainStatus' }
            netWorth:        { $ref: '#/components/schemas/SyncDomainStatus' }

    DomainState:
      type: object
      required: [domain, instanceId, revision, initialized, data]
      properties:
        domain:      { $ref: '#/components/schemas/SyncDomain' }
        instanceId:  { type: string }
        revision:    { type: integer }
        initialized: { type: boolean }
        data:
          type: object
          nullable: true
          description: Null when the domain was never written.
          oneOf:
            - $ref: '#/components/schemas/SyncedSettings'
            - $ref: '#/components/schemas/CalculatorInputs'
            - $ref: '#/components/schemas/AssetAllocationDocument'
            - $ref: '#/components/schemas/ExpenseTrackerDocument'
            - $ref: '#/components/schemas/NetWorthDocument'

    Changeset:
      type: object
      additionalProperties: false
      description: |
        Changes to one domain. Items are the app's document entities plus
        placement fields: `position` (0-based index in the list the app shows;
        omitted items go last), and `year`/`month` for items that live in a
        month. Optional fields may be omitted or null.

        | Domain | `set` | collections (`upsert` item, `delete` key) |
        | --- | --- | --- |
        | settings | `settings`: SyncedSettings | none |
        | calculator | `inputs`: CalculatorInputs or null (deletes) | none |
        | assetAllocation | `assetClassTargets`: AssetClassTargets or null | `assets`: AssetDocument, key `id` |
        | expenseTracker | `config`: `{ currency, currentYear, currentMonth }`; `planning`: ExpensePlanningData or null | `years` (`{ year, isArchived? }`, key `"2025"`), `months` (`{ year, month, isClosed? }`, key `"2025-03"`), `expenses`, `incomes` (key `id`), `monthBudgets` (CategoryBudgetDocument with year/month, key `"2025-03\|GROCERIES"`), `globalBudgets` (key = category), `customCategories`, `categoryOverrides` (key `id`) |
        | netWorth | `config`: `{ defaultCurrency, currentYear, currentMonth, settings: { showPensionInNetWorth, includeUnrealizedGains, syncWithAssetAllocation? } }` | `years`, `months` (`{ year, month, isFrozen, frozenDate?, monthNote? }`), `assets` (holdings), `cashEntries`, `pensions`, `debts`, `taxes`, `operations` (key `id`) |

        Ids are unique per collection across all months: upserting an
        existing id updates it and can move it to another month. A key may
        appear only once per collection. The same validation as the granular
        routes applies (non-negative amounts, real calendar dates, enums,
        currencies, `amount = unitAmount x quantity`, unique scheduled
        occurrences). Retired category ids FEES and HOLIDAYS are stored as
        BUSINESS and TRAVEL.
      properties:
        initialize:
          type: boolean
          description: 'Marks the database as the source of truth for the domain. `{ "initialize": true }` alone writes nothing else.'
        set:
          type: object
          description: Singletons by name.
          additionalProperties: true
        upsert:
          type: object
          description: Items to insert or update, by collection.
          additionalProperties:
            type: array
            items:
              type: object
              additionalProperties: true
              properties:
                position: { type: integer, minimum: 0, nullable: true }
                year:     { type: integer, minimum: 1900, maximum: 2200 }
                month:    { type: integer, minimum: 1, maximum: 12 }
        delete:
          type: object
          description: Keys to delete, by collection. Missing keys are ignored.
          additionalProperties:
            type: array
            items: { type: string }

    ChangesetResult:
      type: object
      required: [domain, revision, previousRevision, initialized]
      properties:
        domain:           { $ref: '#/components/schemas/SyncDomain' }
        revision:         { type: integer, description: 'Revision after this write.' }
        previousRevision: { type: integer, description: 'Revision just before this write, read in the same transaction. If it differs from the one you last saw, someone else wrote in between.' }
        initialized:      { type: boolean }

    ChangesetError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code:    { type: string, enum: [invalid_body, conflict] }
            message: { type: string }
            details:
              type: object
              required: [collection, key, message]
              properties:
                collection: { type: string, nullable: true, description: 'Collection name, or "set" for singletons.' }
                key:        { type: string, nullable: true, description: 'Item key, singleton name, or "#index" when the item has no key.' }
                message:    { type: string }

    SyncedSettings:
      type: object
      description: >-
        Settings the app keeps in the database. Device-local settings (backend,
        updater, logging, AI model configuration) are not part of it; unknown
        keys are ignored on writes.
      required:
        - accountName
        - decimalSeparator
        - decimalPlaces
        - currencySettings
        - privacyMode
        - dateFormat
        - fireAssetClassInclusion
        - includePrimaryResidenceInFIRE
        - searchThreshold
        - experimentalFeatures
        - aiFeaturesEnabled
      properties:
        accountName:      { type: string, maxLength: 100 }
        decimalSeparator: { type: string, enum: ['.', ','] }
        decimalPlaces:    { type: integer, minimum: 0, maximum: 4 }
        currencySettings: { $ref: '#/components/schemas/CurrencySettings' }
        privacyMode:      { type: boolean }
        country:          { type: string }
        dateFormat:       { type: string, enum: [DD/MM/YYYY, MM/DD/YYYY, YYYY-MM-DD] }
        fireAssetClassInclusion: { $ref: '#/components/schemas/AssetClassInclusionMap' }
        includePrimaryResidenceInFIRE: { type: boolean }
        searchThreshold:  { type: number, minimum: 0 }
        experimentalFeatures: { $ref: '#/components/schemas/ExperimentalFeatures' }
        aiFeaturesEnabled: { type: boolean }
        language:         { type: string, enum: [en, it, fr, de, es] }

    AssetDocument:
      type: object
      required: [id, name, ticker, assetClass, subAssetType, currentValue, targetMode, isPrimaryResidence]
      properties:
        id:               { type: string }
        name:             { type: string }
        ticker:           { type: string }
        isin:             { type: string }
        assetClass:       { $ref: '#/components/schemas/AssetClass' }
        subAssetType:     { $ref: '#/components/schemas/SubAssetType' }
        currentValue:     { type: number }
        shares:           { type: number }
        pricePerShare:    { type: number }
        acquisitionPrice: { type: number }
        originalCurrency: { $ref: '#/components/schemas/SupportedCurrency' }
        originalValue:    { type: number }
        targetMode:       { $ref: '#/components/schemas/AllocationMode' }
        targetValue:      { type: number }
        targetPercent:    { type: number }
        institutionCode:  { type: string }
        institutionName:  { type: string }
        mortgageData:     { $ref: '#/components/schemas/MortgageData' }
        isPrimaryResidence: { type: boolean }
        marketPrice:      { type: number }

    AssetAllocationDocument:
      type: object
      required: [assets, assetClassTargets]
      properties:
        assets:
          type: array
          items: { $ref: '#/components/schemas/AssetDocument' }
        assetClassTargets:
          type: object
          nullable: true
          description: AssetClassTargets, or null when none are saved.
          additionalProperties:
            type: object
            required: [targetMode]
            properties:
              targetMode:    { $ref: '#/components/schemas/AllocationMode' }
              targetPercent: { type: number }

    TransactionDocument:
      type: object
      required: [id, date, amount, description, isRecurring]
      properties:
        id:            { type: string }
        date:          { type: string, format: date }
        amount:        { type: number, minimum: 0 }
        description:   { type: string }
        currency:      { $ref: '#/components/schemas/SupportedCurrency' }
        isRecurring:   { type: boolean }
        scheduleId:    { type: string, description: 'Paired with scheduledDate; not allowed with isRecurring.' }
        scheduledDate: { type: string, format: date }

    ExpenseDocument:
      allOf:
        - $ref: '#/components/schemas/TransactionDocument'
        - type: object
          required: [type, category, expenseType]
          properties:
            type:        { type: string, enum: [expense] }
            category:    { type: string, description: 'Built-in ExpenseCategory id or custom category id.' }
            subCategory: { type: string }
            expenseType: { $ref: '#/components/schemas/ExpenseType' }
            unitAmount:  { type: number, description: 'Paired with quantity; amount = unitAmount x quantity.' }
            quantity:    { type: number }

    IncomeDocument:
      allOf:
        - $ref: '#/components/schemas/TransactionDocument'
        - type: object
          required: [type, source]
          properties:
            type:   { type: string, enum: [income] }
            source: { $ref: '#/components/schemas/IncomeSource' }

    CategoryBudgetDocument:
      type: object
      required: [category, monthlyBudget]
      properties:
        category:      { type: string }
        monthlyBudget: { type: number }
        currency:      { $ref: '#/components/schemas/SupportedCurrency' }

    ExpenseMonthDocument:
      type: object
      required: [year, month, isClosed, incomes, expenses, budgets]
      properties:
        year:     { type: integer }
        month:    { type: integer, minimum: 1, maximum: 12 }
        isClosed: { type: boolean }
        incomes:
          type: array
          items: { $ref: '#/components/schemas/IncomeDocument' }
        expenses:
          type: array
          items: { $ref: '#/components/schemas/ExpenseDocument' }
        budgets:
          type: array
          items: { $ref: '#/components/schemas/CategoryBudgetDocument' }

    ExpenseTrackerDocument:
      type: object
      required: [years, currentYear, currentMonth, currency, globalBudgets]
      description: >-
        The app's cashflow data. `customCategories`, `categoryOverrides` and
        `planning` are omitted when empty. Without a saved config, currency is
        EUR and the current year and month are today's.
      properties:
        years:
          type: array
          items:
            type: object
            required: [year, isArchived, months]
            properties:
              year:       { type: integer }
              isArchived: { type: boolean }
              months:
                type: array
                items: { $ref: '#/components/schemas/ExpenseMonthDocument' }
        currentYear:  { type: integer }
        currentMonth: { type: integer, minimum: 1, maximum: 12 }
        currency:     { $ref: '#/components/schemas/SupportedCurrency' }
        globalBudgets:
          type: array
          items: { $ref: '#/components/schemas/CategoryBudgetDocument' }
        customCategories:
          type: array
          items:
            type: object
            required: [id, name, icon, color, defaultExpenseType]
            properties:
              id:                 { type: string }
              name:               { type: string }
              icon:               { type: string }
              color:              { type: string }
              defaultExpenseType: { $ref: '#/components/schemas/ExpenseType' }
        categoryOverrides:
          type: array
          items:
            type: object
            required: [id]
            properties:
              id:    { type: string, description: 'Built-in ExpenseCategory id.' }
              name:  { type: string }
              icon:  { type: string }
              color: { type: string }
        planning: { $ref: '#/components/schemas/ExpensePlanningData' }

    NetWorthMonthDocument:
      type: object
      required: [year, month, assets, cashEntries, pensions, operations, debts, taxes, isFrozen]
      description: >-
        Items use the same fields as the granular net worth schemas with `id`
        set to the client id (no `externalId`, no numeric id). Optional fields
        are omitted when empty. Computed totals are not stored.
      properties:
        year:        { type: integer }
        month:       { type: integer, minimum: 1, maximum: 12 }
        assets:      { type: array, items: { type: object, additionalProperties: true }, description: 'AssetHolding fields' }
        cashEntries: { type: array, items: { type: object, additionalProperties: true }, description: 'CashEntry fields' }
        pensions:    { type: array, items: { type: object, additionalProperties: true }, description: 'PensionEntry fields' }
        operations:  { type: array, items: { type: object, additionalProperties: true }, description: 'FinancialOperation fields' }
        debts:       { type: array, items: { type: object, additionalProperties: true }, description: 'DebtEntry fields' }
        taxes:       { type: array, items: { type: object, additionalProperties: true }, description: 'TaxEntry fields' }
        isFrozen:    { type: boolean }
        frozenDate:  { type: string }
        monthNote:   { type: string }

    NetWorthDocument:
      type: object
      required: [years, currentYear, currentMonth, defaultCurrency, settings]
      properties:
        years:
          type: array
          items:
            type: object
            required: [year, isArchived, months]
            properties:
              year:       { type: integer }
              isArchived: { type: boolean }
              months:
                type: array
                items: { $ref: '#/components/schemas/NetWorthMonthDocument' }
        currentYear:     { type: integer }
        currentMonth:    { type: integer, minimum: 1, maximum: 12 }
        defaultCurrency: { $ref: '#/components/schemas/SupportedCurrency' }
        settings:
          type: object
          required: [showPensionInNetWorth, includeUnrealizedGains, syncWithAssetAllocation]
          properties:
            showPensionInNetWorth:   { type: boolean }
            includeUnrealizedGains:  { type: boolean }
            syncWithAssetAllocation: { type: boolean }
