openapi: 3.0.3
info:
  title: Fire Tools API
  version: 0.1.0
  description: |
    REST API contract for the Fire Tools backend (local-deployment / Electron).

    The Node.js + Express backend is implemented for local Docker and Electron
    deployments. When the app is connected to a backend (the desktop app's
    embedded backend, or Settings > Backend), the SQLite database is the source
    of truth for five domains the app displays: settings, FIRE calculator
    inputs, asset allocation, cashflow (expense tracker) and net worth. Writes
    to those domains, through the granular routes or `/state/{domain}`, show up
    in the running app within about 3 seconds. Other routes (questionnaire,
    notifications, Monte Carlo runs, portfolio metadata, users) are stored in
    the database only and are not shown in the app. Receipt originals are
    stored in the local backend SQLite DB.

    Agent onboarding
    ----------------
    1. `GET /sync/status` to discover the domains and their revisions.
    2. `GET /state/{domain}` to read the document the app shows.
    3. `PATCH /state/{domain}` with a Changeset to add or change items
       (or use the granular routes), then read the document again.

    Conventions
    -----------
    * Base path: `/api/v1`
    * Payload casing: **camelCase** (matches `src/types/*.ts`)
    * Date format: ISO-8601 strings (`YYYY-MM-DD` for dates, full ISO for timestamps)
    * Money: floating-point numbers in the account's display currency
    * Errors: `{ "error": { "code": string, "message": string, "details"?: any } }`
    * Pagination: cursor-style (`?cursor=&limit=`) on list endpoints that can grow large
    * IDs: every resource exposes a numeric server `id` **and** a stable
      `externalId` (client-minted) — clients pass `externalId` on upsert.
    * Auth: without a configured token every request runs unauthenticated as
      the single local user. When the server has a token (`API_TOKEN`, or the
      desktop app's per-launch token, plus the client token while
      Settings > API access is on), every route except `GET /health` needs
      `Authorization: Bearer <token>`; otherwise it answers
      `401 unauthorized`.
    * Body limits: 2 MB JSON (`413 payload_too_large`); `/state/{domain}`
      accepts up to 50 MB.
  license:
    name: MIT
    url: https://github.com/fire-tools-inc/app/blob/main/LICENSE
  contact:
    name: Fire Tools
    url: https://github.com/fire-tools-inc/app

servers:
  - url: http://localhost:8080/api/v1
    description: Local dev / Docker

tags:
  - name: System
    description: Service health and metadata
  - name: Users
    description: User identity (multi-tenant ready, single bootstrap user by default)
  - name: Settings
    description: Per-user UI, currency, FIRE, and experimental-feature settings
  - name: Notifications
    description: In-app notification feed and channel preferences
  - name: Calculator
    description: Stored FIRE calculator inputs
  - name: MonteCarlo
    description: Persisted Monte Carlo simulation runs and per-run logs
  - name: AssetAllocation
    description: Portfolio holdings, allocation targets, and configuration
  - name: ExpenseTracker
    description: Monthly cashflow tracker (incomes, expenses, budgets, custom categories)
  - name: NetWorthTracker
    description: Monthly net worth snapshots and financial operations
  - name: Questionnaire
    description: FIRE-persona questionnaire results
  - name: PdfImport
    description: Experimental — drafts parsed from PDFs (receipts, statements, payslips)
  - name: PortfolioBreakdown
    description: Experimental — cached ticker metadata and breakdown computations
  - name: Banks
    description: Read-mostly lookup of supported banks/brokers with OpenBanking support flag
  - name: UiPreferences
    description: Generic per-user UI preferences (tour, banners, dismissable prompts)
  - name: Sync
    description: >-
      Whole-domain documents the app reads and writes: settings, calculator,
      assetAllocation, expenseTracker and netWorth. Revisions change on every
      write, including writes through the granular routes.

# Optional bearer token: required only when the server is started with one.
security:
  - {}
  - bearerAuth: []

# =============================================================================
# Paths
# =============================================================================
paths:
  # ---------------------------------------------------------------------------
  # System
  # ---------------------------------------------------------------------------
  /health:
    get:
      tags: [System]
      summary: Liveness probe
      description: Always open, even when the server requires a bearer token.
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  # ---------------------------------------------------------------------------
  # Sync: whole-domain documents the app displays
  # ---------------------------------------------------------------------------
  /sync/status:
    get:
      tags: [Sync]
      summary: Revision and initialization of every synced domain
      description: >-
        All five domains are always listed; `revision` is 0 for a domain that
        was never written. Revisions change on every write (state routes and
        granular routes) and are only meaningful for equality checks. The app
        polls this every few seconds and reloads a domain whose revision changed.
      operationId: getSyncStatus
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /state/{domain}:
    parameters:
      - $ref: '#/components/parameters/SyncDomainPath'
    get:
      tags: [Sync]
      summary: Read the document the app shows for a domain
      description: >-
        `data` is the app's own document shape (see the `*Document` schemas):
        optional keys are omitted rather than null, ids are the client-minted
        string ids, list items keep the order the app shows. `data` is null
        when the domain was never written. Years and months are sorted
        ascending.
      operationId: getDomainState
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DomainState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Sync]
      summary: Merge a changeset into a domain
      description: >-
        Applies deletes (items, then months, then years), then `set`, then
        upserts (years, months, items) in one transaction. Upserts insert or
        update by key and may move an item to another month; missing months and
        years are created. Deleting a month or year deletes its items. Any
        invalid item rejects the whole request and nothing is written.
      operationId: patchDomainState
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Changeset' }
            examples:
              addExpense:
                summary: Add an expense and a month budget to March 2025
                value:
                  upsert:
                    expenses:
                      - id: txn-agent-0001
                        type: expense
                        date: '2025-03-04'
                        amount: 42.5
                        description: Weekly groceries
                        category: GROCERIES
                        expenseType: NEED
                        year: 2025
                        month: 3
                    monthBudgets:
                      - { category: GROCERIES, monthlyBudget: 400, year: 2025, month: 3 }
              netWorthMonth:
                summary: Record a cash balance and a pension value for January 2025
                value:
                  upsert:
                    cashEntries:
                      - { id: nw-agent-cash, accountName: Checking, accountType: CHECKING, balance: 2500, currency: EUR, year: 2025, month: 1 }
                    pensions:
                      - { id: nw-agent-pension, name: Workplace pension, currentValue: 18000, currency: EUR, pensionType: EMPLOYER, year: 2025, month: 1 }
              deleteItems:
                summary: Delete an expense and a whole month
                value:
                  delete:
                    expenses: [txn-agent-0001]
                    months: ['2024-12']
      responses:
        '200':
          description: Applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangesetResult' }
        '400': { $ref: '#/components/responses/InvalidChange' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ConflictingChange' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
    put:
      tags: [Sync]
      summary: Replace a domain with a changeset
      description: >-
        Deletes every item of the domain for the user, then applies the
        changeset like PATCH, in one transaction. An empty changeset clears the
        domain (`data` becomes null). For `settings` the synced fields are reset
        to defaults instead and the AI model configuration is kept. If anything
        is invalid the previous data is kept.
      operationId: replaceDomainState
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Changeset' }
      responses:
        '200':
          description: Applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangesetResult' }
        '400': { $ref: '#/components/responses/InvalidChange' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ConflictingChange' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }

  # ---------------------------------------------------------------------------
  # Users (only useful for multi-tenant deployments; single-user uses id=1)
  # ---------------------------------------------------------------------------
  /users/me:
    get:
      tags: [Users]
      summary: Get the current user (or the bootstrap user in single-user mode)
      description: Stored in the database only and not shown in the app.
      operationId: getCurrentUser
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }

  # ---------------------------------------------------------------------------
  # Settings
  # ---------------------------------------------------------------------------
  /settings:
    get:
      tags: [Settings]
      summary: Get user settings
      operationId: getSettings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSettings' }
    put:
      tags: [Settings]
      summary: Replace user settings
      operationId: replaceSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserSettings' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
    patch:
      tags: [Settings]
      summary: Update user settings (partial)
      operationId: updateSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserSettingsPatch' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSettings' }

  /settings/notifications:
    get:
      tags: [Settings, Notifications]
      summary: Get notification preferences
      description: Stored in the database only and not shown in the app.
      operationId: getNotificationPreferences
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreferences' }
    put:
      tags: [Settings, Notifications]
      summary: Replace notification preferences
      description: Stored in the database only and not shown in the app.
      operationId: replaceNotificationPreferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationPreferences' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreferences' }

  /settings/file:
    get:
      tags: [Settings]
      summary: Inspect the settings.json sidecar file
      description: |
        Returns the absolute path of the on-disk settings.json sidecar that
        mirrors the database, plus its current parsed contents. The file lives
        next to the SQLite database (Electron user data folder in production).
      operationId: getSettingsFile
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettingsFileEnvelope' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /settings/file/sync:
    post:
      tags: [Settings]
      summary: Force-resync settings.json from the database
      description: |
        Rewrites the sidecar file from current DB state. Useful after manual
        DB modifications or to recover from a quarantined file.
      operationId: syncSettingsFile
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [path, ok]
                properties:
                  path: { type: string }
                  ok: { type: boolean }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /settings/file/import:
    post:
      tags: [Settings]
      summary: Import a settings.json payload into the database
      description: |
        Applies a SettingsFileShape payload into the database for the resolved
        user, then resyncs the sidecar file. Partial settings are allowed; partial
        notificationPreferences are rejected (use PUT /settings/notifications).
      operationId: importSettingsFile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettingsFileShape' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [settings, notificationPreferences]
                properties:
                  settings: { $ref: '#/components/schemas/UserSettings' }
                  notificationPreferences: { $ref: '#/components/schemas/NotificationPreferences' }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ---------------------------------------------------------------------------
  # Notifications
  # ---------------------------------------------------------------------------
  /notifications:
    get:
      tags: [Notifications]
      summary: List notifications
      description: Stored in the database only and not shown in the app.
      operationId: listNotifications
      parameters:
        - { in: query, name: unreadOnly, schema: { type: boolean, default: false } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationList' }
    post:
      tags: [Notifications]
      summary: Create a notification (typically server-generated)
      description: Stored in the database only and not shown in the app.
      operationId: createNotification
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notification' }

  /notifications/{externalId}:
    parameters:
      - $ref: '#/components/parameters/ExternalId'
    get:
      tags: [Notifications]
      summary: Get a notification
      description: Stored in the database only and not shown in the app.
      operationId: getNotification
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notification' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Notifications]
      summary: Update a notification (e.g. mark read)
      description: Stored in the database only and not shown in the app.
      operationId: updateNotification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                read: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notification' }
    delete:
      tags: [Notifications]
      summary: Delete a notification
      description: Stored in the database only and not shown in the app.
      operationId: deleteNotification
      responses:
        '204': { description: Deleted }

  /notifications/mark-all-read:
    post:
      tags: [Notifications]
      summary: Mark every unread notification as read
      description: Stored in the database only and not shown in the app.
      operationId: markAllNotificationsRead
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated: { type: integer }

  # ---------------------------------------------------------------------------
  # FIRE calculator inputs
  # ---------------------------------------------------------------------------
  /calculator/inputs:
    get:
      tags: [Calculator]
      summary: Get saved calculator inputs
      operationId: getCalculatorInputs
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalculatorInputs' }
    put:
      tags: [Calculator]
      summary: Replace calculator inputs
      operationId: replaceCalculatorInputs
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CalculatorInputs' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalculatorInputs' }

  # ---------------------------------------------------------------------------
  # Monte Carlo runs (history)
  # ---------------------------------------------------------------------------
  /calculator/monte-carlo/runs:
    get:
      tags: [MonteCarlo]
      summary: List saved Monte Carlo runs
      description: Stored in the database only and not shown in the app.
      operationId: listMonteCarloRuns
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonteCarloRunList' }
    post:
      tags: [MonteCarlo]
      summary: Save a Monte Carlo run
      description: Stored in the database only and not shown in the app.
      operationId: createMonteCarloRun
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MonteCarloRunCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonteCarloRun' }

  /calculator/monte-carlo/runs/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [MonteCarlo]
      summary: Get a Monte Carlo run (including logs if stored)
      description: Stored in the database only and not shown in the app.
      operationId: getMonteCarloRun
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonteCarloRunWithLogs' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [MonteCarlo]
      summary: Delete a Monte Carlo run
      description: Stored in the database only and not shown in the app.
      operationId: deleteMonteCarloRun
      responses:
        '204': { description: Deleted }

  # ---------------------------------------------------------------------------
  # Asset Allocation
  # ---------------------------------------------------------------------------
  /asset-allocation/config:
    get:
      tags: [AssetAllocation]
      summary: Get asset allocation config
      description: Stored in the database only and not shown in the app.
      operationId: getAssetAllocationConfig
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetAllocationConfig' }
    put:
      tags: [AssetAllocation]
      summary: Replace asset allocation config
      description: Stored in the database only and not shown in the app.
      operationId: replaceAssetAllocationConfig
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssetAllocationConfig' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetAllocationConfig' }

  /asset-allocation/assets:
    get:
      tags: [AssetAllocation]
      summary: List assets
      operationId: listAssets
      parameters:
        - in: query
          name: assetClass
          schema: { $ref: '#/components/schemas/AssetClass' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Asset' }
    post:
      tags: [AssetAllocation]
      summary: Create an asset
      operationId: createAsset
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Asset' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Asset' }

  /asset-allocation/assets/{externalId}:
    parameters:
      - $ref: '#/components/parameters/ExternalId'
    get:
      tags: [AssetAllocation]
      summary: Get an asset
      operationId: getAsset
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Asset' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [AssetAllocation]
      summary: Replace an asset (upsert by externalId)
      operationId: replaceAsset
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Asset' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Asset' }
    delete:
      tags: [AssetAllocation]
      summary: Delete an asset
      operationId: deleteAsset
      responses:
        '204': { description: Deleted }

  /asset-allocation/targets:
    get:
      tags: [AssetAllocation]
      summary: Get the asset class targets
      description: Returns `{}` when no targets are saved.
      operationId: getAssetClassTargets
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetClassTargets' }
    put:
      tags: [AssetAllocation]
      summary: Replace the asset class targets
      description: Classes missing from the body have no target afterwards.
      operationId: replaceAssetClassTargets
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssetClassTargets' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetClassTargets' }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ---------------------------------------------------------------------------
  # Expense tracker
  # ---------------------------------------------------------------------------
  /expense-tracker/planning:
    get:
      tags: [ExpenseTracker]
      summary: Get the local backend cashflow planning document
      description: >-
        Returns empty planning state when absent without creating data. The
        document is part of the `expenseTracker` state the app shows.
      operationId: getExpensePlanning
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpensePlanningData' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [ExpenseTracker]
      summary: Replace the complete per-user cashflow planning document
      description: Validates before atomic replacement. Does not post transactions or change goal accounting.
      operationId: replaceExpensePlanning
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpensePlanningData' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpensePlanningData' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413':
          description: Request body exceeds 2 MB
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /expense-tracker/config:
    get:
      tags: [ExpenseTracker]
      summary: Get expense tracker config
      operationId: getExpenseTrackerConfig
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpenseTrackerConfig' }
    put:
      tags: [ExpenseTracker]
      summary: Replace expense tracker config
      operationId: replaceExpenseTrackerConfig
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseTrackerConfig' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpenseTrackerConfig' }

  /expense-tracker/months/{year}/{month}:
    parameters:
      - $ref: '#/components/parameters/Year'
      - $ref: '#/components/parameters/Month'
    get:
      tags: [ExpenseTracker]
      summary: Get a month (incomes, expenses, budgets)
      operationId: getExpenseMonth
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonthData' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [ExpenseTracker]
      summary: Replace a month wholesale (bulk upsert)
      operationId: replaceExpenseMonth
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MonthData' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonthData' }
    patch:
      tags: [ExpenseTracker]
      summary: Update month metadata (e.g. isClosed)
      operationId: updateExpenseMonth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isClosed: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonthData' }

  /expense-tracker/expenses:
    get:
      tags: [ExpenseTracker]
      summary: List expense entries (with filters)
      operationId: listExpenses
      parameters:
