name: Auto bump patch version

# Respect a version selected in a main push; otherwise bump the patch.
# GITHUB_TOKEN tag pushes do not trigger workflows, so call Release explicitly.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bump:
    name: Prepare release version and tag
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    concurrency:
      group: version-bump-main
      cancel-in-progress: false
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout merged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Prepare and push release refs
        id: release
        run: bash scripts/auto-release.sh
        env:
          RELEASE_BEFORE: ${{ github.event.before }}
          RELEASE_SOURCE: ${{ github.sha }}

  release:
    name: Build and publish the bumped version
    needs: bump
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.bump.outputs.tag }}
    secrets: inherit
