name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.pages.outputs.pages }}
      server: ${{ steps.filter.outputs.server }}
      full: ${{ steps.filter.outputs.full }}
      browser: ${{ steps.filter.outputs.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            # Page-scoped filters. A page test job runs when EITHER
            # its test directory or a source file matching the page changes.
            asset_allocation:
              - 'tests/pages/asset-allocation/**'
              - 'src/components/{Asset,Allocation,Portfolio,Breakdown,DCA,Editable,Collapsible,MassEdit}*'
              - 'src/utils/{allocation,portfolio,price,yahoo,ticker,etf,exchange,currency,defaultAssets,dca}*'
            expense_tracker:
              - 'tests/pages/expense-tracker/**'
              - 'src/components/{Expense,Income,Monthly,CategoryManager,PDFImport,Receipt,MassEdit,Cashflow,SavingsGoals,ImportRules}*'
              - 'src/utils/{expense,pdf,liteParse,documentImport,dateValidation,demoExpense,llm,categories,customCategories,cashflowSchedules,scheduledTransactions,savingsGoals,importCategorizationRules}*'
            fire_calculator:
              - 'tests/pages/fire-calculator/**'
              - 'src/components/{Calculator,FIRE,MonteCarlo,Projection}*'
              - 'src/utils/{fire,monteCarlo,chartHelper,projection}*'
            homepage:
              - 'tests/pages/homepage/**'
              - 'src/components/{HomePage,DashboardChart}*'
              - 'src/utils/dashboard*'
            net_worth_tracker:
              - 'tests/pages/net-worth-tracker/**'
              - 'src/components/{NetWorth,Historical}*'
              - 'src/utils/{netWorth,depreciation,mortgage,dataSync}*'
            questionnaire:
              - 'tests/pages/questionnaire/**'
              - 'src/components/{Questionnaire,GuidedTour}*'
              - 'src/utils/{questionnaire,tourPreferences,notification}*'
            settings:
              - 'tests/pages/settings/**'
              - 'src/components/{Settings,Cookie,DataManagement,Policy,Language}*'
              - 'src/utils/{cookie,settings,banner,dataExport,countryToRegion,urlParams}*'
              - 'src/utils/{csvExport,expenseCsv,expensePlanning,currencyConverter}*'
              - 'src/i18n/**'
              - 'tests/shared/i18n*'
            server:
              - 'server/**'
              - 'scripts/**'
              - '.nvmrc'
              - '.github/workflows/tests.yml'
              - 'src/utils/{liteParseResult,pdfHeuristics,dateValidation}.ts'
              - 'tests/shared/diagnostics.ts'
              - 'src/utils/expensePlanning.ts'
              - 'src/types/{expensePlanning,expenseTracker}.ts'
              - 'tests/pages/expense-tracker/planningFixtures.ts'
            browser:
              - 'tests/browser/**'
              - 'playwright.config.ts'
              - 'src/components/**'
              - 'src/App.*'
              - 'src/index.css'
              - 'src/main.tsx'
              - 'src/constants/navbarLabels.ts'
              - 'src/utils/{chartColors,expenseChartColors,navigationPreferences}*'
              - 'src/utils/dashboard*'
              - 'src/utils/{documentImport,liteParse,pdfImport,expenseStatistics,dateValidation,cookieSettings,llmCategorizer}*'
              - 'src/utils/{expensePlanning,cashflowSchedules,scheduledTransactions,savingsGoals,importCategorizationRules,demoExpensePlanning}*'
              - 'server/src/{documentParser,documentWorker,receiptFiles}.*'
              - 'server/src/routes/receipts.ts'
              - 'server/public/**'
              - 'src/hooks/**'
              - 'src/workers/**'
              - 'index.html'
              - 'package.json'
              - 'package-lock.json'
              - '.nvmrc'
              - 'vite.config.ts'
              - 'electron-builder.yml'
              - '.github/workflows/tests.yml'
            # Full suite when shared utilities/components/types change, or when
            # build config / package files change.
            full:
              - 'scripts/{release.sh,auto-release.sh,release-version.mjs,bump-version.mjs}'
              - '.github/workflows/{release,version-bump}.yml'
              - 'tests/setup.ts'
              - 'tests/shared/**'
              - 'tests/types/**'
              - 'tests/README.md'
              - 'src/App.tsx'
              - 'src/main.tsx'
              - 'src/types/**'
              - 'src/hooks/**'
              - 'src/utils/cookieSettings.ts'
              - 'package.json'
              - 'package-lock.json'
              - '.nvmrc'
              - 'vite.config.ts'
              - 'electron-builder.yml'
              - 'tsconfig*.json'
              - '.github/workflows/tests.yml'
      - name: Select changed page jobs
        id: pages
        env:
          CHANGED_FILTERS: ${{ steps.filter.outputs.changes }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const changed = JSON.parse(process.env.CHANGED_FILTERS);
          if (!Array.isArray(changed) || changed.some(name => typeof name !== 'string')) {
            throw new Error('Path filters must emit an array of filter names.');
          }
          const pages = [
            'asset_allocation', 'expense_tracker', 'fire_calculator', 'homepage',
            'net_worth_tracker', 'questionnaire', 'settings',
          ].filter(page => changed.includes(page)).map(page => page.replaceAll('_', '-'));
          appendFileSync(process.env.GITHUB_OUTPUT, `pages=${JSON.stringify(pages)}\n`);
          NODE

  full:
    name: Full FE test suite
    needs: changes
    if: ${{ needs.changes.outputs.full == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # Skip root postinstall (electron/native rebuild) in FE-only CI jobs.
      - run: npm ci --ignore-scripts
      - run: npm test -- --run

  browser-tests:
    name: Browser UI regressions
    needs: changes
    if: ${{ needs.changes.outputs.browser == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm --prefix server ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser -- --workers=2

  page:
    name: Page tests
    needs: changes
    if: ${{ needs.changes.outputs.full != 'true' && needs.changes.outputs.pages != '[]' && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        page: ${{ fromJSON(needs.changes.outputs.pages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run tests for ${{ matrix.page }}
        run: npm test -- --run tests/pages/${{ matrix.page }}/

  server-tests:
    name: Server test suite
    needs: changes
    if: ${{ needs.changes.outputs.server == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      # Keep bundled SQLite prebuilds; the pretest hook verifies plain Node.
      - run: npm ci --ignore-scripts
      - run: npm --prefix server ci --ignore-scripts
      - run: npm --prefix server test

  docker-stack:
    name: Docker stack health
    needs: changes
    if: ${{ needs.changes.outputs.server == 'true' || needs.changes.outputs.full == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build images (no cache)
        run: docker compose build --no-cache
      - name: Start stack
        run: docker compose up -d
      - name: Wait for backend to become healthy
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q backend)" 2>/dev/null || echo "starting")
            echo "attempt $i: backend health = $status"
            if [ "$status" = "healthy" ]; then exit 0; fi
            sleep 2
          done
          echo "backend never became healthy"
          docker compose logs backend
          exit 1
      - name: Probe backend /health from host
        run: |
          backend_id=$(docker compose ps -q backend)
          ip=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$backend_id")
          curl --fail --silent --show-error "http://$ip:8787/api/v1/health" | tee /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
      - name: Probe frontend on host port
        run: |
          for _ in $(seq 1 20); do
            if curl --fail --silent --show-error http://localhost:8080/ -o /dev/null; then
              echo "frontend reachable"; exit 0
            fi
            sleep 2
          done
          echo "frontend never responded on :8080"
          docker compose logs frontend
          exit 1
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans
