<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/fire-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0B1018" />
    <meta name="description" content="Fire Tools - A local-first financial planning workspace. Track your portfolio, cashflow and net worth, and plan financial independence with projections and simulations." />
    <link rel="preload" href="/src/assets/fonts/material-symbols.woff2" as="font" type="font/woff2" crossorigin />
    <title>Fire Tools - Financial planning workspace</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html { color-scheme: dark; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #0B1018;
        color: #EDF2F8;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
      }
      #root, .app { min-height: 100vh; }
      .app { display: flex; flex-direction: column; }
      .app-header {
        display: flex;
        align-items: center;
        gap: 2rem;
        min-height: 76px;
        padding: 0.75rem 2rem;
        background: rgba(19, 28, 40, 0.92);
        border-bottom: 1px solid #344355;
      }
      .app-brand { display: inline-flex; align-items: center; gap: 0.65rem; color: inherit; text-decoration: none; }
      .app-brand h1 { font-family: 'Avenir Next', 'Segoe UI', sans-serif; font-size: 1.05rem; font-weight: 600; }
      .app-nav, .nav-links, .nav-actions { display: flex; align-items: center; }
      .app-nav { flex: 1; justify-content: space-between; gap: 1.25rem; min-width: 0; }
      .nav-links { gap: 0.25rem; }
      .nav-toggle { display: none; }
      @media (max-width: 1100px) {
        .app-header { gap: 1rem; padding: 0.75rem 1.25rem; }
        .nav-toggle { display: flex; }
        .nav-links { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
